<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>On-Call Rotation: IT Tools Hub</title>
  <script src="../../shared/msal-browser.min.js"></script>
  <script src="../../shared/auth.js"></script>
  <link rel="stylesheet" href="../../shared/styles.css"/>
  <style>
    /* Prevent auth-screen flash on load (matches sibling tools). */
    #authScreen { display:none; }
    body { opacity:0; transition:opacity .15s; }

    .main-content { max-width:1200px; margin:0 auto; padding:32px 40px 60px; }

    /* ── Hero ── */
    .hero { display:flex; align-items:center; gap:14px; border-radius:14px; padding:18px 20px; margin-bottom:20px;
            background:color-mix(in srgb, var(--green) 24%, var(--glass-fill));
            border:1px solid color-mix(in srgb, var(--green) 30%, var(--glass-border));
            backdrop-filter:blur(16px); color:var(--text); }
    .hero-avatar { width:48px; height:48px; border-radius:50%; border:2px solid var(--glass-border); display:flex; align-items:center;
                   justify-content:center; font-weight:700; font-size:17px; flex-shrink:0; color:#fff; }
    .hero-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
                   color:color-mix(in srgb, var(--green) 70%, var(--text)); }
    .hero-name { font-size:22px; font-weight:700; margin:2px 0 8px; color:var(--text); }
    .hero-phones { display:flex; gap:6px; flex-wrap:wrap; }
    .hero-chip { font-size:11px; border-radius:20px; padding:3px 10px;
                 background:color-mix(in srgb, var(--green) 16%, transparent);
                 color:color-mix(in srgb, var(--green) 65%, var(--text)); }

    /* ── Calendar nav ── */
    .cal-navbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .year-seg { display:inline-flex; background:var(--surface-2, var(--surface)); border:1px solid var(--border); border-radius:8px; padding:2px; }
    .year-seg span { padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
    .year-seg span.on { background:var(--blue); color:#fff; font-weight:700; }
    .cal-search { border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:12px; background:var(--surface);
                  color:var(--text); width:150px; }
    .cal-nav-btns { display:flex; align-items:center; gap:6px; }
    .cal-nav-btns button { display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border);
                            border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--text); }
    .cal-nav-btns button.today-btn { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }

    /* ── Calendar strip ── */
    .month-row { display:flex; gap:6px; margin-bottom:4px; }
    .month-lbl { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .week-strip { display:flex; gap:6px; margin-bottom:8px; }
    .week-tile { flex:1; border:1px solid var(--border); border-radius:10px; padding:0 0 12px; text-align:center;
                 background:var(--surface); cursor:pointer; position:relative; transition:box-shadow .15s; overflow:hidden; }
    .week-tile:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .week-tile.today { border-color:var(--blue); box-shadow:0 0 0 2px color-mix(in srgb, var(--blue) 25%, transparent); }
    .week-tile .tile-date-bar { display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
                                 background:color-mix(in srgb, var(--text) 6%, transparent); padding:7px 8px; margin-bottom:10px;
                                 box-sizing:border-box; }
    .week-tile .tile-date { font-size:11px; font-weight:600; color:var(--text); }
    .week-tile .tile-dot { width:30px; height:30px; border-radius:50%; margin:0 auto 4px; display:flex; align-items:center;
                            justify-content:center; font-size:10px; font-weight:700; color:#fff; }
    .week-tile .tile-name { font-size:11px; font-weight:600; }
    .week-tile .ribbon { position:absolute; top:-16px; left:50%; transform:translateX(-50%); background:var(--blue); color:#fff;
                          font-size:9px; padding:2px 8px; border-radius:10px; font-weight:700; z-index:1; }
    .week-tile .tile-flags { display:flex; gap:3px; color:var(--muted); }
    .week-tile .tile-flags svg { display:block; }

    .month-pills { display:flex; gap:6px; margin-bottom:20px; }
    .month-pill { flex:1; text-align:center; font-size:11px; background:var(--surface); border:1px solid var(--border); border-radius:14px;
                  padding:7px 4px; cursor:pointer; color:var(--text); }
    .month-pill.current { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }

    .edit-toggle-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px;
                        border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; }
    .edit-toggle-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }

    /* ── Build Mode ── */
    .build-trigger-btn { display:flex; align-items:center; gap:6px; background:var(--green); color:#fff; border:none;
                          border-radius:10px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
    .build-setup-bar { display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:16px; border-radius:14px;
                        background:var(--glass-fill); border:1px solid var(--glass-border); backdrop-filter:blur(16px); }
    .setup-field { display:flex; flex-direction:column; gap:3px; font-size:12px; }
    .setup-field .tag { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; }
    .setup-field .val { font-weight:600; color:var(--text); }
    .setup-go-btn { margin-left:auto; background:var(--green); color:#fff; border:none; border-radius:10px; padding:8px 16px;
                    font-weight:700; font-size:12px; cursor:pointer; }
    .setup-cancel-btn { background:none; border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-weight:600;
                        font-size:12px; cursor:pointer; color:var(--muted); }
    .build-canvas-panel { padding:14px 16px; border-radius:14px; background:var(--glass-fill);
                           border:1px solid var(--glass-border); backdrop-filter:blur(16px); margin-bottom:14px; }
    .build-month-group { margin-bottom:12px; }
    .build-month-lbl { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 4px 2px; }
    .build-ribbon { display:flex; gap:5px; flex-wrap:wrap; }
    .build-block { width:56px; height:52px; border-radius:9px; display:flex; flex-direction:column; align-items:center;
                   justify-content:center; gap:2px; color:#fff; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.1); }
    .build-block.existing { opacity:.55; cursor:default; }
    .build-block.dragging { transform:translateY(-8px) rotate(-3deg) scale(1.06); box-shadow:0 10px 20px rgba(0,0,0,.22); z-index:3; }
    .build-block.drag-over { outline:2px dashed rgba(0,0,0,.35); outline-offset:2px; }
    .build-block .build-block-initials { font-size:13px; font-weight:800; letter-spacing:.02em; }
    .build-block .build-block-date { font-size:9px; font-weight:600; opacity:.85; }
    .build-commit-bar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:14px;
                        background:var(--glass-fill); border:1px solid var(--glass-border); backdrop-filter:blur(16px); font-size:12px; }
    .build-commit-bar > div { display:flex; gap:8px; }
    .ghost-btn { background:none; border:1px solid var(--border); border-radius:10px; padding:8px 16px; font-weight:600;
                 font-size:12px; cursor:pointer; color:var(--muted); }
    .build-popover { position:absolute; width:200px; padding:12px; z-index:50; border-radius:12px;
                      background:var(--glass-fill); border:1px solid var(--glass-border);
                      backdrop-filter:blur(16px); box-shadow:0 14px 28px rgba(0,0,0,.16); }
    .build-popover .pop-field { margin-bottom:8px; }
    .build-popover .pop-field label { display:block; font-size:10px; color:var(--muted); font-weight:700; margin-bottom:3px;
                                       text-transform:uppercase; }

    /* ── Roster ── */
    .roster-section { margin-top:24px; }
    .roster-lbl { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px; }
    .roster-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px; }
    .roster-card { border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface); cursor:pointer;
                   transition:box-shadow .15s; }
    .roster-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .roster-card.dim { opacity:.6; }
    .roster-card-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .roster-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:700; color:#fff; flex-shrink:0; }
    .roster-name { font-size:13px; font-weight:700; }
    .roster-role { font-size:10px; color:var(--muted); }
    .roster-chips { display:flex; gap:5px; flex-wrap:wrap; }
    .roster-chip { font-size:10px; font-weight:600; padding:3px 10px; border-radius:20px;
                    background:color-mix(in srgb, var(--blue) 12%, var(--glass-fill));
                    border:1px solid color-mix(in srgb, var(--blue) 25%, var(--glass-border));
                    color:color-mix(in srgb, var(--blue) 70%, var(--text)); }
    .roster-chip.more { background:transparent; border:none; color:var(--blue); font-weight:700; padding:3px 2px; }
    .add-tile { border:1px dashed var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center;
                gap:6px; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; min-height:70px; }
    .add-tile:hover { border-color:var(--blue); color:var(--blue); }
    .roster-drag-handle { display:flex; align-items:center; cursor:grab; color:var(--muted); margin-right:2px; }
    .roster-card.dragging { opacity:.4; }
    .roster-card.drag-over { outline:2px dashed var(--blue); outline-offset:2px; }

    /* ── Detail panel (shared: calendar week + roster contact) ── */
    #panelBackdrop { position:fixed; top:var(--topbar-h); left:0; right:0; bottom:0; background:rgba(0,0,0,0); pointer-events:none;
                     transition:background .15s; z-index:40; }
    #panelBackdrop.open { background:rgba(0,0,0,.25); pointer-events:auto; }
    #detailPanel { position:fixed; top:var(--topbar-h); right:0; bottom:0; width:340px; background:var(--surface); border-left:1px solid var(--border);
                   box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(100%); transition:transform .2s; z-index:41;
                   padding:20px; overflow-y:auto; }
    #detailPanel.open { transform:translateX(0); }
    .panel-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .panel-dot { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                 font-weight:700; font-size:12px; color:#fff; flex-shrink:0; }
    .panel-title { font-size:14px; font-weight:700; color:var(--text); }
    .panel-sub { font-size:11px; color:var(--muted); }
    .panel-badge { font-size:10px; background:#fef3c7; color:#92400e; padding:2px 9px; border-radius:10px; font-weight:700; margin-left:auto; }
    .panel-close { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; margin-left:4px; }
    .panel-row, .panel-field { margin-bottom:12px; }
    .panel-row label, .panel-field label { display:block; font-size:10px; text-transform:uppercase; color:var(--muted);
                                            letter-spacing:.05em; margin-bottom:4px; font-weight:700; }
    .panel-value { font-size:13px; color:var(--text); }
    .panel-input, .panel-select { width:100%; border:1px solid var(--border); border-radius:6px; padding:7px 9px; font-size:12px;
                                   background:var(--bg); color:var(--text); box-sizing:border-box; font-family:inherit; }
    .panel-toggle-row { display:flex; align-items:center; justify-content:space-between; font-size:12px; margin-bottom:12px; }
    .panel-toggle-row label { margin:0; text-transform:none; font-size:12px; font-weight:400; color:var(--text); }
    .phone-chip-row { font-size:12px; color:var(--text); margin-bottom:4px; }
    .phone-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
    .phone-row .panel-input.phone-label { flex:0 0 90px; }
    .phone-row .panel-input.phone-num { flex:1; }
    .phone-rm { color:#c33; cursor:pointer; display:flex; }
    .add-phone-link { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--blue); font-weight:600; cursor:pointer;
                       margin-bottom:14px; }
    .panel-btnrow { display:flex; gap:8px; margin-top:16px; }
    .panel-btnrow .btn { flex:1; }
  </style>
</head>
<body>
<div id="topbar"></div>

<!-- ── Auth screen ── -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>On-Call Rotation</h1>
    <p>Sign in with your M365 account to view the on-call schedule.</p>
    <button class="btn-ms" onclick="doSignIn()">Sign in with Microsoft</button>
    <div class="auth-error" id="authErr" style="display:none"></div>
  </div>
</div>

<!-- ── App screen ── -->
<div id="appScreen" style="display:none">
  <div class="app-body">
    <main class="main-content">
      <div id="deniedScreen" style="display:none">
        <h2>Access Restricted</h2>
        <p>This tool isn't available for your access group.</p>
      </div>
      <div id="toolContent" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h1>On-Call Rotation</h1>
          <div id="adminControls" style="display:none; align-items:center; gap:10px;">
            <button class="edit-toggle-btn" id="editToggleBtn" onclick="toggleEditMode()" title="Edit Mode"></button>
            <button class="btn btn-primary" id="saveBtn" style="display:none" onclick="saveChanges()">Save</button>
          </div>
        </div>
        <div class="hero" id="heroCard"></div>

        <div class="cal-navbar">
          <div class="year-seg" id="yearSeg"></div>
          <div id="buildTriggerWrap"></div>
          <input class="cal-search" id="searchInput" placeholder="Jump to person"
                 onkeydown="if(event.key==='Enter') searchPerson(this.value)"/>
          <div class="cal-nav-btns">
            <button onclick="shiftStrip(-1)" id="navPrevBtn"></button>
            <button class="today-btn" onclick="goToday()">Today</button>
            <button onclick="shiftStrip(1)" id="navNextBtn"></button>
          </div>
        </div>
        <div class="month-row" id="monthRow"></div>
        <div class="week-strip" id="weekStrip"></div>
        <div class="month-pills" id="monthPills"></div>
        <div id="buildSetupBar" class="build-setup-bar" style="display:none"></div>
        <div id="buildCanvasSection" style="display:none"></div>

        <div class="roster-section" id="rosterSection">
          <div class="roster-lbl" id="rotationLbl"></div>
          <div class="roster-grid" id="rotationGrid"></div>
          <div class="roster-lbl">Other Contacts</div>
          <div class="roster-grid" id="otherGrid"></div>
        </div>
      </div>
    </main>
    <div id="panelBackdrop" onclick="closePanel()"></div>
    <div id="detailPanel">
      <div class="panel-head">
        <div class="panel-dot" id="panelDot"></div>
        <div>
          <div class="panel-title" id="panelTitle"></div>
          <div class="panel-sub" id="panelSub"></div>
        </div>
        <span class="panel-badge" id="panelBadge" style="display:none">Edit Mode</span>
        <button class="panel-close" id="panelCloseBtn" onclick="closePanel()"></button>
      </div>
      <div id="panelBody"></div>
    </div>
  </div>
</div>

<script>
const TOOL_SCOPES        = ["User.Read"];
const GSD_GROUP_ID       = "3e1a4757-8189-4908-a611-b6029399e69e";
const ONCALL_ADMIN_GROUP = "SG-IT-Tools-OnCall-Admin";
// Left blank until the Function App (Task 10) is provisioned and deployed (Task 11).
// While blank, the tool reads/writes the local data.json file instead of the live blob.
const ONCALL_GET_URL  = "";
const ONCALL_SAVE_URL = "";

const PERSON_PALETTE      = ["#059669", "#1a56db", "#d97706", "#9333ea", "#dc2626", "#0891b2", "#db2777"];
const OTHER_CONTACT_COLOR = "#9ca3af";
const WEEKS_VISIBLE       = 5;

const ICON_CHEVRON_LEFT  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
const ICON_CHEVRON_RIGHT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;
const ICON_SEARCH        = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>`;
const ICON_PLUS          = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
const ICON_X             = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;
const ICON_FILE_TEXT     = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>`;
const ICON_PALMTREE      = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8c0-2.76-2.46-5-5.5-5S2 5.24 2 8h2l1-1 1 1h4"/><path d="M13 7.14A5.82 5.82 0 0 1 16.5 6c3.04 0 5.5 2.24 5.5 5h-3l-1-1-1 1h-3"/><path d="M5.89 9.71c-2.15 2.15-2.3 5.47-.35 7.43l4.24-4.25.7-.7.71-.71 2.12-2.12c-1.95-1.96-5.27-1.8-7.42.35"/><path d="M11 15.5c.5 2.5-.17 4.5-1 6.5h4c2-5.5-.5-12-1-14"/></svg>`;
const ICON_PENCIL        = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>`;
const ICON_GRIP          = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>`;

function ordinal(n) {
  const suffixes = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (suffixes[(v - 20) % 10] || suffixes[v] || suffixes[0]);
}

function initials(name) {
  return name.split(" ").map(p => p[0]).filter(Boolean).slice(0, 2).join("").toUpperCase();
}

function buildPersonColors(data) {
  const map = {};
  const sortedNames = data.rotationTechs.map(t => t.shortName).slice().sort();
  sortedNames.forEach((shortName, i) => { map[shortName] = PERSON_PALETTE[i % PERSON_PALETTE.length]; });
  return map;
}

function personColorFor(shortName) {
  return st.personColors[shortName] || OTHER_CONTACT_COLOR;
}

const st = { data: null, year: "2026", isAdmin: false, stripStart: 0, panel: null, draft: null, build: null };

async function doSignIn() {
  try {
    const acct = await ITTools.auth.signIn();
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("appScreen").style.display  = "block";
    ITTools.ui.setUser(acct);
    await afterSignIn();
  } catch(e) {
    const el = document.getElementById("authErr");
    el.textContent = e.message; el.style.display = "block";
  }
}

async function afterSignIn() {
  const token = await ITTools.auth.getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0/me/checkMemberObjects", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ ids: [GSD_GROUP_ID] }),
  });
  const denied = res.ok && (await res.json()).value.includes(GSD_GROUP_ID);
  if (denied) {
    document.getElementById("deniedScreen").style.display = "block";
    return;
  }
  document.getElementById("toolContent").style.display = "block";

  await checkOnCallAdminAccess();
  if (st.isAdmin) document.getElementById("adminControls").style.display = "flex";
  await loadData();
}

async function checkOnCallAdminAccess() {
  try {
    const enc = encodeURIComponent(`displayName eq '${ONCALL_ADMIN_GROUP}'`);
    const res = await ITTools.graph.get(`https://graph.microsoft.com/v1.0/groups?$filter=${enc}&$select=id`);
    const groups = res.value || [];
    if (!groups.length) { st.isAdmin = false; return; }
    const groupId = groups[0].id;
    const memberships = await ITTools.graph.getAll(`https://graph.microsoft.com/v1.0/me/transitiveMemberOf?$select=id`);
    st.isAdmin = memberships.some(m => m.id === groupId);
  } catch (_) {
    st.isAdmin = false; // fail secure
  }
}

async function loadData() {
  if (ONCALL_GET_URL) {
    const token = await ITTools.auth.getToken();
    const res = await fetch(ONCALL_GET_URL, { headers: { Authorization: "Bearer " + token } });
    st.data = await res.json();
  } else {
    const res = await fetch("data.json?v=" + Date.now());
    st.data = await res.json();
  }
  st.personColors = buildPersonColors(st.data);
  renderAll();
}

function renderAll() {
  renderHero();
  renderYearSeg();
  renderCalendarStrip();
  renderRoster();
  renderBuildTrigger();
}

// ── Hero card (current on-call week) ───────────────────────
function findCurrentWeek(schedule) {
  const today = new Date();
  const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  let best = null;
  for (const row of schedule) {
    const rowUtc = Date.parse(row.startDate + "T00:00:00Z");
    if (rowUtc <= todayUtc && (!best || rowUtc > Date.parse(best.startDate + "T00:00:00Z"))) {
      best = row;
    }
  }
  return best;
}

function renderHero() {
  const week = findCurrentWeek(st.data.schedule);
  const hero = document.getElementById("heroCard");
  if (!week) { hero.innerHTML = "<p>No current on-call week found.</p>"; return; }
  const tech = st.data.rotationTechs.find(t => t.shortName === week.tech);
  const name = tech ? tech.name : week.tech;
  const color = personColorFor(week.tech);
  hero.innerHTML = `
    <div class="hero-avatar" style="background:${color}">${initials(name)}</div>
    <div>
      <div class="hero-label">On Call This Week</div>
      <div class="hero-name">${name}</div>
      <div class="hero-phones">
        ${(tech ? tech.phones : []).map(p => `<span class="hero-chip">${p.label} ${p.number}</span>`).join("")}
      </div>
    </div>
  `;
}

// ── Calendar strip ──────────────────────────────────────────
function getYearWeeks(year) {
  return st.data.schedule.filter(r => r.startDate.startsWith(year));
}

function getScheduleYears() {
  const years = new Set(st.data.schedule.map(r => r.startDate.slice(0, 4)));
  return Array.from(years).sort();
}

function renderYearSeg() {
  const years = getScheduleYears();
  if (!years.includes(st.year)) st.year = years[years.length - 1] || st.year;
  document.getElementById("yearSeg").innerHTML = years.map(y =>
    `<span class="${y === st.year ? "on" : ""}" onclick="setYear('${y}')">${y}</span>`
  ).join("");
}

function setYear(y) {
  st.year = y;
  st.stripStart = 0;
  renderYearSeg();
  renderCalendarStrip();
}

function shiftStrip(direction) {
  st.stripStart += direction * WEEKS_VISIBLE;
  renderCalendarStrip();
}

function jumpToWeek(indexInYear) {
  const weeks = getYearWeeks(st.year);
  const maxStart = Math.max(0, weeks.length - WEEKS_VISIBLE);
  st.stripStart = Math.min(Math.max(0, indexInYear - Math.floor(WEEKS_VISIBLE / 2)), maxStart);
  renderCalendarStrip();
}

function goToday() {
  const week = findCurrentWeek(st.data.schedule);
  if (!week) return;
  st.year = week.startDate.slice(0, 4);
  renderYearSeg();
  const weeks = getYearWeeks(st.year);
  jumpToWeek(weeks.findIndex(w => w.startDate === week.startDate));
}

function searchPerson(query) {
  const q = query.trim().toLowerCase();
  if (!q) return;
  const weeks = getYearWeeks(st.year);
  if (!weeks.length) return;
  for (let step = 1; step <= weeks.length; step++) {
    const idx = (st.stripStart + step) % weeks.length;
    const tech = st.data.rotationTechs.find(t => t.shortName === weeks[idx].tech);
    const name = (tech ? tech.name : weeks[idx].tech).toLowerCase();
    if (name.includes(q)) { jumpToWeek(idx); return; }
  }
}

function monthLabelsHtml(weeks) {
  const groups = [];
  weeks.forEach(w => {
    const label = new Date(w.startDate + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }).toUpperCase();
    if (groups.length && groups[groups.length - 1].label === label) groups[groups.length - 1].count++;
    else groups.push({ label, count: 1 });
  });
  return groups.map(g => `<div class="month-lbl" style="flex:${g.count}">${g.label}</div>`).join("");
}

function tileHtml(row, todayStr) {
  const tech = st.data.rotationTechs.find(t => t.shortName === row.tech);
  const name = tech ? tech.name : row.tech;
  const color = personColorFor(row.tech);
  const start = new Date(row.startDate + "T00:00:00Z");
  const end = new Date(start.getTime() + 6 * 86400000);
  const fmt = (d, withMonth) => (withMonth ? d.toLocaleDateString("en-US", { month: "long", timeZone: "UTC" }) + " " : "") + ordinal(d.getUTCDate());
  const crossesMonth = start.getUTCMonth() !== end.getUTCMonth();
  const rangeLabel = fmt(start, true) + " to " + fmt(end, crossesMonth);
  const flags = (row.notes ? ICON_FILE_TEXT : "") + (row.timeOff ? ICON_PALMTREE : "");
  const isToday = row.startDate === todayStr;
  return `
    <div class="week-tile${isToday ? " today" : ""}" onclick="openWeekPanel('${row.startDate}')">
      ${isToday ? `<div class="ribbon">This Week</div>` : ""}
      <div class="tile-date-bar">
        <div class="tile-date">${rangeLabel}</div>
        ${flags ? `<div class="tile-flags">${flags}</div>` : ""}
      </div>
      <div class="tile-dot" style="background:${color}">${initials(name)}</div>
      <div class="tile-name">${row.tech}</div>
    </div>`;
}

function renderCalendarStrip() {
  const weeks = getYearWeeks(st.year);
  const todayWeek = findCurrentWeek(st.data.schedule);
  const todayStr = todayWeek ? todayWeek.startDate : null;
  const maxStart = Math.max(0, weeks.length - WEEKS_VISIBLE);
  st.stripStart = Math.min(Math.max(0, st.stripStart), maxStart);
  const visible = weeks.slice(st.stripStart, st.stripStart + WEEKS_VISIBLE);

  document.getElementById("monthRow").innerHTML = monthLabelsHtml(visible);
  document.getElementById("weekStrip").innerHTML = visible.map(w => tileHtml(w, todayStr)).join("");
  renderMonthPills(visible);
}

const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function renderMonthPills(visible) {
  const inViewMonths = new Set(visible.map(w => new Date(w.startDate + "T00:00:00Z").getUTCMonth()));
  document.getElementById("monthPills").innerHTML = MONTH_NAMES.map((name, i) =>
    `<div class="month-pill${inViewMonths.has(i) ? " current" : ""}" onclick="jumpToMonth(${i})">${name}</div>`
  ).join("");
}

function jumpToMonth(monthIndex) {
  const weeks = getYearWeeks(st.year);
  const idx = weeks.findIndex(w => new Date(w.startDate + "T00:00:00Z").getUTCMonth() === monthIndex);
  if (idx === -1) return;
  const maxStart = Math.max(0, weeks.length - WEEKS_VISIBLE);
  st.stripStart = Math.min(idx, maxStart);
  renderCalendarStrip();
}

// ── Build Mode ──────────────────────────────────────────────
function computeYearSundays(year) {
  const y = Number(year);
  let d = new Date(Date.UTC(y, 0, 1));
  while (d.getUTCDay() !== 0) d.setUTCDate(d.getUTCDate() + 1);
  const sundays = [];
  while (d.getUTCFullYear() === y) {
    sundays.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 7);
  }
  return sundays;
}

function getNextGapYear() {
  const years = getScheduleYears();
  const lastYear = years.length ? Number(years[years.length - 1]) : new Date().getUTCFullYear();
  const candidate = String(lastYear + 1);
  const sundays = computeYearSundays(candidate);
  const existing = new Set(st.data.schedule.map(r => r.startDate));
  const hasGap = sundays.some(d => !existing.has(d));
  return hasGap ? candidate : null;
}

function renderBuildTrigger() {
  const wrap = document.getElementById("buildTriggerWrap");
  const gapYear = (st.isAdmin && editMode) ? getNextGapYear() : null;
  wrap.innerHTML = gapYear
    ? `<button class="build-trigger-btn" onclick="openBuildSetup('${gapYear}')">${ICON_PENCIL} Build ${gapYear} Rotation</button>`
    : "";
}

function describeContinuation(year) {
  const sundays = computeYearSundays(year);
  const before = st.data.schedule
    .filter(r => r.startDate < sundays[0])
    .sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
  if (!before) return { fromLabel: "No prior rotation history", nextLabel: "", nextIdx: 0 };
  const fromIdx = st.data.rotationTechs.findIndex(t => t.shortName === before.tech);
  const fromTech = st.data.rotationTechs.find(t => t.shortName === before.tech);
  const nextIdx = fromIdx === -1 ? 0 : (fromIdx + 1) % st.data.rotationTechs.length;
  const nextTech = st.data.rotationTechs[nextIdx];
  return {
    fromLabel: (fromTech ? fromTech.name : before.tech) + " (" + before.startDate + ")",
    nextLabel: nextTech ? nextTech.name : "",
    nextIdx
  };
}

function openBuildSetup(year) {
  st.build = { phase: "setup", year, weeks: [] };
  setBuildViewVisibility();
  renderBuildSetupBar();
}

function renderBuildSetupBar() {
  const info = describeContinuation(st.build.year);
  document.getElementById("buildSetupBar").innerHTML = `
    <div class="setup-field"><span class="tag">Start date</span><span class="val">January 1st, ${st.build.year}</span></div>
    <div class="setup-field"><span class="tag">Length</span><span class="val">Full year</span></div>
    <div class="setup-field"><span class="tag">Continuing from</span><span class="val">${info.fromLabel} &rarr; next: ${info.nextLabel}</span></div>
    <button class="setup-go-btn" onclick="generateProposal()">Generate Proposal</button>
    <button class="setup-cancel-btn" onclick="cancelBuild()">Cancel</button>
  `;
}

function cancelBuild() {
  closeBuildPopover();
  st.build = null;
  setBuildViewVisibility();
  renderBuildTrigger();
}

function setBuildViewVisibility() {
  const inBuild = !!st.build;
  document.getElementById("monthRow").style.display = inBuild ? "none" : "flex";
  document.getElementById("weekStrip").style.display = inBuild ? "none" : "flex";
  document.getElementById("monthPills").style.display = inBuild ? "none" : "flex";
  document.getElementById("rosterSection").style.display = inBuild ? "none" : "block";
  document.getElementById("buildSetupBar").style.display = (inBuild && st.build.phase === "setup") ? "flex" : "none";
  document.getElementById("buildCanvasSection").style.display = (inBuild && st.build.phase === "canvas") ? "block" : "none";
}

function generateProposal() {
  const year = st.build.year;
  const sundays = computeYearSundays(year);
  const existingByDate = {};
  st.data.schedule.forEach(r => { existingByDate[r.startDate] = r; });
  const info = describeContinuation(year);
  let position = info.nextIdx;
  const weeks = sundays.map(startDate => {
    const existingRow = existingByDate[startDate];
    if (existingRow) {
      const idx = st.data.rotationTechs.findIndex(t => t.shortName === existingRow.tech);
      if (idx !== -1) position = (idx + 1) % st.data.rotationTechs.length;
      return { startDate, tech: existingRow.tech, timeOff: existingRow.timeOff, notes: existingRow.notes, existing: true };
    }
    const tech = st.data.rotationTechs[position];
    position = (position + 1) % st.data.rotationTechs.length;
    return { startDate, tech: tech ? tech.shortName : "", timeOff: "", notes: "", existing: false };
  });
  st.build.phase = "canvas";
  st.build.weeks = weeks;
  setBuildViewVisibility();
  renderBuildCanvas();
}

function buildBlockHtml(week, idx) {
  const tech = st.data.rotationTechs.find(t => t.shortName === week.tech);
  const name = tech ? tech.name : week.tech;
  const color = personColorFor(week.tech);
  const blockDate = new Date(week.startDate + "T00:00:00Z");
  const dateLabel = blockDate.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + " " + ordinal(blockDate.getUTCDate());
  const dragAttrs = week.existing ? "" :
    `draggable="true" ondragstart="buildDragStart(event, ${idx})" ondragover="buildDragOver(event)" ondrop="buildDrop(event, ${idx})" ondragend="buildDragEnd(event)" onclick="openBuildPopover(${idx})"`;
  return `
    <div class="build-block${week.existing ? " existing" : ""}" data-idx="${idx}" style="background:${color}"
         title="${name}${week.existing ? " (already saved)" : ""}" ${dragAttrs}>
      <span class="build-block-initials">${initials(name)}</span>
      <span class="build-block-date">${dateLabel}</span>
    </div>`;
}

function renderBuildCanvas() {
  const groups = [];
  st.build.weeks.forEach((w, idx) => {
    const d = new Date(w.startDate + "T00:00:00Z");
    const label = d.toLocaleDateString("en-US", { month: "long", timeZone: "UTC" }).toUpperCase() + " " + d.getUTCFullYear();
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push({ week: w, idx });
  });
  const proposedCount = st.build.weeks.filter(w => !w.existing).length;
  document.getElementById("buildCanvasSection").innerHTML = `
    <div class="build-canvas-panel">
      ${groups.map(g => `
        <div class="build-month-group">
          <div class="build-month-lbl">${g.label}</div>
          <div class="build-ribbon">${g.items.map(it => buildBlockHtml(it.week, it.idx)).join("")}</div>
        </div>`).join("")}
    </div>
    <div class="build-commit-bar">
      <span>${proposedCount} week${proposedCount === 1 ? "" : "s"} proposed</span>
      <div>
        <button class="ghost-btn" onclick="cancelBuild()">Discard</button>
        <button class="setup-go-btn" onclick="commitBuild()">Commit ${st.build.year} Rotation</button>
      </div>
    </div>
  `;
}

let buildDragSrcIdx = null;

function buildDragStart(evt, idx) {
  buildDragSrcIdx = idx;
  evt.currentTarget.classList.add("dragging");
  evt.dataTransfer.effectAllowed = "move";
}

function buildDragOver(evt) {
  evt.preventDefault();
  evt.currentTarget.classList.add("drag-over");
}

function buildDrop(evt, idx) {
  evt.preventDefault();
  evt.currentTarget.classList.remove("drag-over");
  if (buildDragSrcIdx === null || buildDragSrcIdx === idx) return;
  const weeks = st.build.weeks;
  const techA = weeks[buildDragSrcIdx].tech;
  weeks[buildDragSrcIdx].tech = weeks[idx].tech;
  weeks[idx].tech = techA;
  buildDragSrcIdx = null;
  renderBuildCanvas();
}

function buildDragEnd(evt) {
  evt.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".build-block.drag-over").forEach(el => el.classList.remove("drag-over"));
}

let buildPopoverIdx = null;

function openBuildPopover(idx) {
  buildPopoverIdx = idx;
  renderBuildPopover();
}

function closeBuildPopover() {
  buildPopoverIdx = null;
  const el = document.getElementById("buildPopover");
  if (el) el.remove();
}

function renderBuildPopover() {
  const existingEl = document.getElementById("buildPopover");
  if (existingEl) existingEl.remove();
  const week = st.build.weeks[buildPopoverIdx];
  const blockEl = document.querySelector(`.build-block[data-idx="${buildPopoverIdx}"]`);
  if (!blockEl) return;
  const rect = blockEl.getBoundingClientRect();
  const options = st.data.rotationTechs.map(t =>
    `<option value="${t.shortName}"${t.shortName === week.tech ? " selected" : ""}>${t.name}</option>`
  ).join("");
  const pop = document.createElement("div");
  pop.id = "buildPopover";
  pop.className = "build-popover";
  pop.style.top = (rect.bottom + window.scrollY + 6) + "px";
  pop.style.left = (rect.left + window.scrollX) + "px";
  pop.innerHTML = `
    <div class="pop-field"><label>Week of ${week.startDate}</label></div>
    <div class="pop-field"><label>Tech</label>
      <select class="panel-select" onchange="st.build.weeks[${buildPopoverIdx}].tech=this.value">${options}</select>
    </div>
    <div class="pop-field"><label>Time off</label>
      <input class="panel-input" value="${week.timeOff || ""}" onchange="st.build.weeks[${buildPopoverIdx}].timeOff=this.value"/>
    </div>
    <div class="pop-field"><label>Notes</label>
      <input class="panel-input" value="${week.notes || ""}" onchange="st.build.weeks[${buildPopoverIdx}].notes=this.value"/>
    </div>
    <button class="setup-go-btn" style="width:100%" onclick="applyBuildPopover()">Apply</button>
  `;
  document.body.appendChild(pop);
}

function applyBuildPopover() {
  closeBuildPopover();
  renderBuildCanvas();
}

function commitBuild() {
  const proposed = st.build.weeks.filter(w => !w.existing).map(w => ({
    startDate: w.startDate, tech: w.tech, timeOff: w.timeOff || "", notes: w.notes || ""
  }));
  st.data.schedule.push(...proposed);
  st.data.schedule.sort((a, b) => (a.startDate < b.startDate ? -1 : 1));
  const builtYear = st.build.year;
  st.build = null;
  setBuildViewVisibility();
  st.year = builtYear;
  st.stripStart = 0;
  renderAll();
  saveChanges();
}

// ── Edit mode toggle (schedule-side wiring finishes in a later task) ──
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  document.getElementById("editToggleBtn").classList.toggle("active", editMode);
  document.getElementById("saveBtn").style.display = editMode ? "inline-block" : "none";
  if (!editMode && st.build) { st.build = null; setBuildViewVisibility(); }
  closePanel();
  renderCalendarStrip();
  renderRoster();
  renderBuildTrigger();
}

// ── Detail panel (shared shell) ─────────────────────────────
function openPanelShell(color, ini, title, sub) {
  document.getElementById("panelDot").style.background = color;
  document.getElementById("panelDot").textContent = ini;
  document.getElementById("panelTitle").textContent = title;
  document.getElementById("panelSub").textContent = sub;
  document.getElementById("panelBadge").style.display = st.draft ? "inline-block" : "none";
  document.getElementById("detailPanel").classList.add("open");
  document.getElementById("panelBackdrop").classList.add("open");
}

function closePanel() {
  st.panel = null;
  st.draft = null;
  document.getElementById("detailPanel").classList.remove("open");
  document.getElementById("panelBackdrop").classList.remove("open");
}

// ── Week panel ───────────────────────────────────────────────
function openWeekPanel(startDate) {
  const row = st.data.schedule.find(r => r.startDate === startDate);
  const tech = st.data.rotationTechs.find(t => t.shortName === row.tech);
  const name = tech ? tech.name : row.tech;
  st.panel = { kind: "week", startDate };
  st.draft = (st.isAdmin && editMode) ? JSON.parse(JSON.stringify(row)) : null;
  openPanelShell(personColorFor(row.tech), initials(name), "Week of " + row.startDate, st.draft ? "Editing this week's assignment" : name);
  renderWeekPanelBody();
}

function renderWeekPanelBody() {
  const row = st.data.schedule.find(r => r.startDate === st.panel.startDate);
  if (!st.draft) {
    const tech = st.data.rotationTechs.find(t => t.shortName === row.tech);
    const phones = tech ? tech.phones : [];
    document.getElementById("panelBody").innerHTML = `
      <div class="panel-row"><label>On-Call Tech</label><div class="panel-value">${tech ? tech.name : row.tech}</div></div>
      <div class="panel-row"><label>Phone Numbers</label>
        ${phones.length ? phones.map(p => `<div class="phone-chip-row"><strong>${p.label}:</strong> ${p.number}</div>`).join("")
                         : `<div class="phone-chip-row">No numbers on file</div>`}
      </div>
      ${row.timeOff ? `<div class="panel-row"><label>Time Off</label><div class="panel-value">${row.timeOff}</div></div>` : ""}
      ${row.notes ? `<div class="panel-row"><label>Notes</label><div class="panel-value">${row.notes}</div></div>` : ""}
    `;
    return;
  }
  const options = st.data.rotationTechs.map(t =>
    `<option value="${t.shortName}"${t.shortName === st.draft.tech ? " selected" : ""}>${t.name}</option>`
  ).join("");
  document.getElementById("panelBody").innerHTML = `
    <div class="panel-field">
      <label>On-Call Tech</label>
      <select class="panel-select" onchange="st.draft.tech=this.value">${options}</select>
    </div>
    <div class="panel-field">
      <label>Time Off</label>
      <input class="panel-input" value="${st.draft.timeOff || ""}" onchange="st.draft.timeOff=this.value"/>
    </div>
    <div class="panel-field">
      <label>Notes</label>
      <textarea class="panel-input" rows="3" onchange="st.draft.notes=this.value">${st.draft.notes || ""}</textarea>
    </div>
    <div class="panel-btnrow">
      <button class="btn btn-secondary" onclick="closePanel()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWeekPanel()">Save</button>
    </div>
  `;
}

function saveWeekPanel() {
  const row = st.data.schedule.find(r => r.startDate === st.panel.startDate);
  Object.assign(row, st.draft);
  closePanel();
  renderAll();
  saveChanges();
}

// ── Roster ──────────────────────────────────────────────────
function rosterCardHtml(person, group, idx) {
  const color = group === "rotation" ? personColorFor(person.shortName) : OTHER_CONTACT_COLOR;
  const visiblePhones = person.phones.slice(0, 2);
  const extra = person.phones.length - visiblePhones.length;
  const canReorder = group === "rotation" && st.isAdmin && editMode;
  const dragAttrs = canReorder
    ? `draggable="true" ondragstart="rosterDragStart(event, ${idx})" ondragover="rosterDragOver(event)" ondrop="rosterDrop(event, ${idx})" ondragend="rosterDragEnd(event)"`
    : "";
  return `
    <div class="roster-card${group === "other" ? " dim" : ""}" ${dragAttrs} onclick="openContactPanel('${group}', ${idx})">
      <div class="roster-card-top">
        ${canReorder ? `<span class="roster-drag-handle">${ICON_GRIP}</span>` : ""}
        <div class="roster-dot" style="background:${color}">${initials(person.name)}</div>
        <div>
          <div class="roster-name">${person.name}</div>
          <div class="roster-role">${group === "rotation" ? "Rotation" : "Other"}</div>
        </div>
      </div>
      <div class="roster-chips">
        ${visiblePhones.map(p => `<span class="roster-chip">${p.label}</span>`).join("")}
        ${extra > 0 ? `<span class="roster-chip more">+${extra}</span>` : ""}
      </div>
    </div>`;
}

function renderRoster() {
  document.getElementById("rotationLbl").textContent = `Rotation: ${st.data.rotationTechs.length} techs`;
  const rotationHtml = st.data.rotationTechs.map((t, i) => rosterCardHtml(t, "rotation", i)).join("");
  const otherHtml = st.data.otherContacts.map((t, i) => rosterCardHtml(t, "other", i)).join("");
  const addRotationTile = (st.isAdmin && editMode) ? `<div class="add-tile" onclick="addContact('rotation')">${ICON_PLUS} Add to Rotation</div>` : "";
  const addOtherTile = (st.isAdmin && editMode) ? `<div class="add-tile" onclick="addContact('other')">${ICON_PLUS} Add Contact</div>` : "";
  document.getElementById("rotationGrid").innerHTML = rotationHtml + addRotationTile;
  document.getElementById("otherGrid").innerHTML = otherHtml + addOtherTile;
}

let rosterDragSrcIdx = null;

function rosterDragStart(evt, idx) {
  rosterDragSrcIdx = idx;
  evt.currentTarget.classList.add("dragging");
  evt.dataTransfer.effectAllowed = "move";
}

function rosterDragOver(evt) {
  evt.preventDefault();
  evt.currentTarget.classList.add("drag-over");
}

function rosterDrop(evt, idx) {
  evt.preventDefault();
  evt.currentTarget.classList.remove("drag-over");
  if (rosterDragSrcIdx === null || rosterDragSrcIdx === idx) return;
  const arr = st.data.rotationTechs;
  const [moved] = arr.splice(rosterDragSrcIdx, 1);
  arr.splice(idx, 0, moved);
  st.personColors = buildPersonColors(st.data);
  rosterDragSrcIdx = null;
  renderRoster();
  renderCalendarStrip();
  saveChanges();
}

function rosterDragEnd(evt) {
  evt.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".roster-card.drag-over").forEach(el => el.classList.remove("drag-over"));
}

function addContact(group) {
  const arr = st.data[group === "rotation" ? "rotationTechs" : "otherContacts"];
  const blank = group === "rotation" ? { name: "New Person", shortName: "", phones: [] } : { name: "New Person", phones: [] };
  arr.push(blank);
  renderRoster();
  openContactPanel(group, arr.length - 1);
}

// ── Contact panel ────────────────────────────────────────────
function openContactPanel(group, idx) {
  const person = st.data[group === "rotation" ? "rotationTechs" : "otherContacts"][idx];
  st.panel = { kind: "contact", group, idx };
  st.draft = (st.isAdmin && editMode) ? JSON.parse(JSON.stringify(person)) : null;
  if (st.draft && st.draft.shortName === undefined) st.draft.shortName = "";
  const color = group === "rotation" ? personColorFor(person.shortName) : OTHER_CONTACT_COLOR;
  openPanelShell(color, initials(person.name), person.name, group === "rotation" ? "Rotation member" : "Other contact");
  renderContactPanelBody();
}

function renderContactPanelBody() {
  const person = st.data[st.panel.group === "rotation" ? "rotationTechs" : "otherContacts"][st.panel.idx];
  if (!st.draft) {
    document.getElementById("panelBody").innerHTML = `
      <div class="panel-row"><label>Name</label><div class="panel-value">${person.name}</div></div>
      <div class="panel-row"><label>Phone Numbers</label>
        ${person.phones.length ? person.phones.map(p => `<div class="phone-chip-row"><strong>${p.label}:</strong> ${p.number}</div>`).join("")
                                : `<div class="phone-chip-row">No numbers on file</div>`}
      </div>
    `;
    return;
  }
  document.getElementById("panelBody").innerHTML = `
    <div class="panel-field"><label>Full Name</label>
      <input class="panel-input" value="${st.draft.name}" onchange="st.draft.name=this.value"/>
    </div>
    <div class="panel-field"><label>Short Name</label>
      <input class="panel-input" value="${st.draft.shortName}" onchange="st.draft.shortName=this.value"/>
    </div>
    <div class="panel-toggle-row">
      <label>In Rotation</label>
      <label class="tog"><input type="checkbox" id="draftInRotation" ${st.panel.group === "rotation" ? "checked" : ""}/><div class="track"></div></label>
    </div>
    <div id="draftPhones"></div>
    <div class="add-phone-link" onclick="addDraftPhone()">${ICON_PLUS} Add phone number</div>
    <div class="panel-btnrow">
      <button class="btn btn-secondary" onclick="closePanel()">Cancel</button>
      <button class="btn btn-primary" onclick="saveContactPanel()">Save</button>
    </div>
  `;
  renderDraftPhones();
}

function renderDraftPhones() {
  document.getElementById("draftPhones").innerHTML = st.draft.phones.map((p, i) => `
    <div class="phone-row">
      <input class="panel-input phone-label" value="${p.label}" onchange="st.draft.phones[${i}].label=this.value"/>
      <input class="panel-input phone-num" value="${p.number}" onchange="st.draft.phones[${i}].number=this.value"/>
      <span class="phone-rm" onclick="removeDraftPhone(${i})">${ICON_X}</span>
    </div>`).join("");
}

function removeDraftPhone(i) {
  st.draft.phones.splice(i, 1);
  renderDraftPhones();
}

function addDraftPhone() {
  st.draft.phones.push({ label: "", number: "" });
  renderDraftPhones();
}

function saveContactPanel() {
  const wantsRotation = document.getElementById("draftInRotation").checked;
  if (wantsRotation && !st.draft.shortName.trim()) {
    alert("Short Name is required for rotation members (used to match them on the calendar).");
    return;
  }
  const currentlyRotation = st.panel.group === "rotation";
  const sourceArr = st.data[currentlyRotation ? "rotationTechs" : "otherContacts"];
  if (wantsRotation === currentlyRotation) {
    sourceArr[st.panel.idx] = st.draft;
  } else {
    sourceArr.splice(st.panel.idx, 1);
    st.data[wantsRotation ? "rotationTechs" : "otherContacts"].push(st.draft);
    st.personColors = buildPersonColors(st.data);
  }
  closePanel();
  renderAll();
  saveChanges();
}

// ── Save ──────────────────────────────────────────────────
async function saveChanges() {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    if (ONCALL_SAVE_URL) {
      const token = await ITTools.auth.getToken();
      const res = await fetch(ONCALL_SAVE_URL, {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(st.data),
      });
      if (!res.ok) throw new Error("Save failed: " + res.status);
    } else {
      console.warn("ONCALL_SAVE_URL not configured yet — changes are local-only until Task 10/11 land.");
    }
    btn.textContent = "Saved";
    setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 1500);
  } catch (e) {
    alert("Save failed: " + e.message);
    btn.textContent = "Save";
    btn.disabled = false;
  }
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  ITTools.theme.init();
  ITTools.ui.renderTopbar({ toolName: "On-Call Rotation", hubRelPath: "../../", status: "beta" });
  ITTools.ui.syncThemeIcon();
  document.getElementById("navPrevBtn").innerHTML = ICON_CHEVRON_LEFT + " Prev";
  document.getElementById("navNextBtn").innerHTML = "Next " + ICON_CHEVRON_RIGHT;
  document.getElementById("panelCloseBtn").innerHTML = ICON_X;
  document.getElementById("editToggleBtn").innerHTML = ICON_PENCIL;
  document.addEventListener("click", evt => {
    if (buildPopoverIdx === null) return;
    const pop = document.getElementById("buildPopover");
    if (pop && !pop.contains(evt.target) && !evt.target.closest(".build-block")) closeBuildPopover();
  });

  let _sessionFound = false;
  await ITTools.auth.init({
    scopes: TOOL_SCOPES,
    onSignIn: async acct => {
      _sessionFound = true;
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("appScreen").style.display  = "block";
      ITTools.ui.setUser(acct);
      document.body.style.opacity = "1";
      await afterSignIn();
    },
    onSignOut: () => {
      document.getElementById("appScreen").style.display  = "none";
      document.getElementById("authScreen").style.display = "flex";
      ITTools.ui.clearUser();
      document.body.style.opacity = "1";
    }
  });
  if (!_sessionFound) {
    document.getElementById("authScreen").style.display = "flex";
    document.body.style.opacity = "1";
  }
}

window.addEventListener("load", init);
</script>
</body>
</html>
